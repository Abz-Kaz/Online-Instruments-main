     crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <title>Digital Harmonica</title>
    <link rel="stylesheet" href="harmonica.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="harmonica.js" defer></script>
  </head>
  <body>
    <nav class="navbar">
      <ul class="nav-list">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="Services.html">Services</a></li>

      </ul>

    <main class="page page-harmonica">
      <header class="header">
        <h1>Digital Harmonica</h1>
        <p>Key of C Diatonic</p>
      </header>

      <section class="harmonica-wrapper">
        <div class="harmonica-instructions">
          <div class="instruction-row">
            <span class="inst-label">Blow Keys:</span>
            <div class="keys-row">
              <kbd data-kbd="blow-1">1</kbd>
              <kbd data-kbd="blow-2">2</kbd>
              <kbd data-kbd="blow-3">3</kbd>
              <kbd data-kbd="blow-4">4</kbd>
              <kbd data-kbd="blow-5">5</kbd>
              <kbd data-kbd="blow-6">6</kbd>
              <kbd data-kbd="blow-7">7</kbd>
              <kbd data-kbd="blow-8">8</kbd>
              <kbd data-kbd="blow-9">9</kbd>
              <kbd data-kbd="blow-10">0</kbd>
            </div>
          </div>
          <div class="instruction-row">
            <span class="inst-label">Draw Keys:</span>
            <div class="keys-row">
              <kbd data-kbd="draw-1">q</kbd>
              <kbd data-kbd="draw-2">w</kbd>
              <kbd data-kbd="draw-3">e</kbd>
              <kbd data-kbd="draw-4">r</kbd>
              <kbd data-kbd="draw-5">t</kbd>
              <kbd data-kbd="draw-6">y</kbd>
              <kbd data-kbd="draw-7">u</kbd>
              <kbd data-kbd="draw-8">i</kbd>
              <kbd data-kbd="draw-9">o</kbd>
              <kbd data-kbd="draw-10">p</kbd>
            </div>
          </div>
        </div>

        <div class="harmonica-body-wrapper">
          <div class="harmonica-bracket left">
            <div class="screw"></div>
          </div>

          <div class="harmonica-metal-casing">
            <div class="cover-plate top">
              <div class="engraving">Rhythm Realm</div>
            </div>

            <div class="harmonica-comb">
              <div class="harmonica-mouthpiece">
                <!-- Hole 1 -->
                <div class="harmonica-hole" data-hole="1">
                  <button type="button" class="reed-btn blow" data-freq="261.63" data-note="blow-1">
                    <span class="action">Blow</span>
                    <span class="note">C4</span>
                  </button>
                  <div class="hole-label">1</div>
                  <button type="button" class="reed-btn draw" data-freq="293.66" data-note="draw-1">
                    <span class="action">Draw</span>
                    <span class="note">D4</span>
                  </button>
                </div>
                <!-- Hole 2 -->
                <div class="harmonica-hole" data-hole="2">
                  <button type="button" class="reed-btn blow" data-freq="329.63" data-note="blow-2">
                    <span class="action">Blow</span>
                    <span class="note">E4</span>
                  </button>
                  <div class="hole-label">2</div>
                  <button type="button" class="reed-btn draw" data-freq="392.00" data-note="draw-2">
                    <span class="action">Draw</span>
                    <span class="note">G4</span>
                  </button>
                </div>
                <!-- Hole 3 -->
                <div class="harmonica-hole" data-hole="3">
                  <button type="button" class="reed-btn blow" data-freq="392.00" data-note="blow-3">
                    <span class="action">Blow</span>
                    <span class="note">G4</span>
                  </button>
                  <div class="hole-label">3</div>
                  <button type="button" class="reed-btn draw" data-freq="493.88" data-note="draw-3">
                    <span class="action">Draw</span>
                    <span class="note">B4</span>
                  </button>
                </div>
                <!-- Hole 4 -->
                <div class="harmonica-hole" data-hole="4">
                  <button type="button" class="reed-btn blow" data-freq="523.25" data-note="blow-4">
                    <span class="action">Blow</span>
                    <span class="note">C5</span>
                  </button>
                  <div class="hole-label">4</div>
                  <button type="button" class="reed-btn draw" data-freq="587.33" data-note="draw-4">
                    <span class="action">Draw</span>
                    <span class="note">D5</span>
                  </button>
                </div>
                <!-- Hole 5 -->
                <div class="harmonica-hole" data-hole="5">
                  <button type="button" class="reed-btn blow" data-freq="659.25" data-note="blow-5">
                    <span class="action">Blow</span>
                    <span class="note">E5</span>
                  </button>
                  <div class="hole-label">5</div>
                  <button type="button" class="reed-btn draw" data-freq="698.46" data-note="draw-5">
                    <span class="action">Draw</span>
                    <span class="note">F5</span>
                  </button>
                </div>
                <!-- Hole 6 -->
                <div class="harmonica-hole" data-hole="6">
                  <button type="button" class="reed-btn blow" data-freq="783.99" data-note="blow-6">
                    <span class="action">Blow</span>
                    <span class="note">G5</span>
                  </button>
                  <div class="hole-label">6</div>
                  <button type="button" class="reed-btn draw" data-freq="880.00" data-note="draw-6">
                    <span class="action">Draw</span>
                    <span class="note">A5</span>
                  </button>
                </div>
                <!-- Hole 7 -->
                <div class="harmonica-hole" data-hole="7">
                  <button type="button" class="reed-btn blow" data-freq="1046.50" data-note="blow-7">
                    <span class="action">Blow</span>
                    <span class="note">C6</span>
                  </button>
                  <div class="hole-label">7</div>
                  <button type="button" class="reed-btn draw" data-freq="987.77" data-note="draw-7">
                    <span class="action">Draw</span>
                    <span class="note">B5</span>
                  </button>
                </div>
                <!-- Hole 8 -->
                <div class="harmonica-hole" data-hole="8">
                  <button type="button" class="reed-btn blow" data-freq="1318.51" data-note="blow-8">
                    <span class="action">Blow</span>
                    <span class="note">E6</span>
                  </button>
                  <div class="hole-label">8</div>
                  <button type="button" class="reed-btn draw" data-freq="1174.66" data-note="draw-8">
                    <span class="action">Draw</span>
                    <span class="note">D6</span>
                  </button>
                </div>
                <!-- Hole 9 -->
                <div class="harmonica-hole" data-hole="9">
                  <button type="button" class="reed-btn blow" data-freq="1567.98" data-note="blow-9">
                    <span class="action">Blow</span>
                    <span class="note">G6</span>
                  </button>
                  <div class="hole-label">9</div>
                  <button type="button" class="reed-btn draw" data-freq="1396.91" data-note="draw-9">
                    <span class="action">Draw</span>
                    <span class="note">F6</span>
                  </button>
                </div>
                <!-- Hole 10 -->
                <div class="harmonica-hole" data-hole="10">
                  <button type="button" class="reed-btn blow" data-freq="2093.00" data-note="blow-10">
                    <span class="action">Blow</span>
                    <span class="note">C7</span>
                  </button>
                  <div class="hole-label">10</div>
                  <button type="button" class="reed-btn draw" data-freq="1760.00" data-note="draw-10">
                    <span class="action">Draw</span>
                    <span class="note">A6</span>
                  </button>
                </div>
              </div>
            </div>

            <div class="cover-plate bottom"></div>
          </div>

          <div class="harmonica-bracket right">
            <div class="screw"></div>
          </div>
        </div>
      </section>
    </main>
