        <ul>

          <li>A : string1</li>

          <li>G : string5</li>
        </ul>

        <div class="strings">

            <div class="string" id="string5" onclick="playSound('string5')" data-sound="Sounds/String5.wav"></div>
        </div>

        <!-- Body -->
        <div class="body">
            <div class="soundhole"></div>
        </div>
    </div>
    <audio id="String1" src="Sounds/String1.wav" hidden preload="auto"></audio>
    <audio id="String2" src="Sounds/String2.wav" hidden preload="auto"></audio>
