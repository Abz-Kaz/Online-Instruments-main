<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Rhythm Realm</title>
    <link rel="stylesheet" href="Contact.css">
</head>
<body>
    <nav class="navbar">
        <ul class="nav-list">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="Services.html">Services</a></li>
            <li><a href="Contact.html">Contact</a></li>
        </ul>
    </nav>

    <header class="header">
        <h1>Contact Us</h1>
        <p>Get in Touch with Rhythm Realm</p>
    </header>

    <main class="main-content">
        <section class="contact-section">
            <h2>Send Us a Message</h2>
            <form class="contact-form">
                <div class="form-group">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="message">Message:</label>
                    <textarea id="message" name="message" required></textarea>
                </div>
                <button type="submit" class="submit-btn">Send Message</button>
            </form>
        </section>

        <section class="contact-info">
            <h2>Contact Information</h2>
            <p><strong>Email:</strong> info@rhythmrealm.com</p>
            <p><strong>Phone:</strong> +92 (345) 678-9876</p>
            <p><strong>Address:</strong> 123 Music Street, Harmony City, MU 12345</p>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2024 Rhythm Realm | All rights reserved.</p>
    </footer>
</body>
</html>
