        <div class="Instructions">
        <ul>
            <li>A : Kick</li>
            <li>S : Snare</li>
            <li>D : Hihat</li>
            <li>F : Tom1</li>
            <li>G : Tom2</li>
            <li>H : Tom3</li>
           <li> J : Crash1</li>

            <div onclick="playSound('kick2')" style="cursor: pointer;" class="drum kick kick-right">Kick</div>
        </div>
